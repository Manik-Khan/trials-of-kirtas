<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quests — The Trials of Kirtas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="tooltips.css?v=qt1">
  <link rel="stylesheet" href="quests.css?v=q3">
</head>
<body>
  <div id="nav-root"></div>
  <main class="q-root" data-quest-root aria-live="polite">
    <div class="q-state"><b>Opening Quest Log…</b><p>Gathering shared campaign threads.</p></div>
  </main>

  <script src="campaign-moments.js?v=cm2"></script>
  <script src="quest-feed-capture.js?v=qfc3"></script>
  <script src="tooltips.js"></script>
  <script src="quests.js?v=q3"></script>
  <script src="characters.js"></script>
  <script src="nav.js?v=sup10"></script>
  <script src="battle.js?v=settings1"></script>
  <script src="feed-bridge.js"></script>
  <script>
  (function () {
    'use strict';
    var started = false;
    async function startQuestLog() {
      if (started || !window.__tok || !window.__tok.sb) return;
      started = true;
      var profile = window.__tok.ready ? await window.__tok.ready : null;
      window.__questLog = await window.Quests.mount({
        document: document,
        root: document.querySelector('[data-quest-root]'),
        search: location.search,
        profile: profile,
        supabase: window.__tok.sb,
        campaignMoments: window.CampaignMoments
      });
    }
    if (window.__tok && window.__tok.sb) startQuestLog();
    else document.addEventListener('nav:ready', startQuestLog, { once: true });
  })();
  </script>
</body>
</html>
